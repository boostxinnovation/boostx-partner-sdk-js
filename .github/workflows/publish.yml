# Stages the package on npm when a v* tag is pushed, through trusted publishing (OIDC): no npm token is stored. A
# staged version is not public; it is published once a maintainer approves it with 2FA.
#
# One-time prerequisites, done by hand by the owner:
#   1. The npm org `boostxinnovation` exists, and the owner's npm account can publish to it.
#   2. The package exists: a trusted publisher can only be configured for one. Publish a placeholder `0.0.0` by
#      hand once and `npm deprecate` it; every real version then comes from this workflow, with provenance.
#   3. On npmjs.com, the package's trusted publisher is GitHub Actions with organization `boostxinnovation`, repository
#      `boostx-partner-sdk-js` and workflow filename `publish.yml` (case-sensitive; renaming this file breaks it),
#      allowed to run `npm stage publish` only ("Allow npm publish" left unchecked).
#      A new configuration expires unless a publish through it succeeds within 2 days: add it shortly before the
#      first tag this workflow should publish.
#   4. The repository is public: npm attaches provenance only to a package published from a public repository.
#
# For every release, after this workflow has passed: approve the staged version with 2FA, on the package's page on
# npmjs.com or with `npm stage list @boostxinnovation/partner-sdk` and `npm stage approve <stage-id>`; a wrong one is
# removed with `npm stage reject <stage-id>`.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check the tag matches package.json
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi
      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
      - name: Check test/spec against the pinned spec commit
        run: |
          tag="$(sed -n 's/^tag=//p' SPEC_VERSION)"
          commit="$(sed -n 's/^commit=//p' SPEC_VERSION)"
          version="v$(node -p 'require("./package.json").version')"
          if [ "${tag%.*}" != "${version%.*}" ]; then
            echo "::error::SPEC_VERSION names spec $tag, package.json is $version: an SDK carries its spec's major and minor version"
            exit 1
          fi
          git clone --depth 1 --branch "$tag" https://github.com/boostxinnovation/boostx-partner-sdk-spec "$RUNNER_TEMP/spec"
          actual="$(git -C "$RUNNER_TEMP/spec" rev-parse HEAD)"
          if [ "$actual" != "$commit" ]; then
            echo "::error::spec tag $tag is commit $actual, SPEC_VERSION names $commit"
            exit 1
          fi
          diff -r "$RUNNER_TEMP/spec/vectors" test/spec
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:workerd
      # The npm bundled with Node 24.22 (11.19.1) has `npm stage`; an npm without it fails here and stages nothing.
      - run: npm stage publish
